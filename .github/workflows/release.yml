name: Release

# Releases a version end to end when a push to main carries a version that npm does not have yet:
#   1. checks that package.json and server.json carry the same version;
#   2. builds, tests and publishes @gblin-protocol/mcp-server to npm through trusted publishing (OIDC, no token);
#   3. publishes server.json to the MCP Registry through GitHub OIDC;
#   4. creates the tag and the GitHub release, which directories that track releases (such as Glama) rebuild from.
# A push that does not change the version does nothing. The workflow can also be started by hand from the Actions tab.

on:
  push:
    branches: [main]
    paths: ["package.json", "server.json"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read and compare versions
        id: version
        run: |
          PKG=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          SRV=$(node -p "require('./server.json').version")
          SRV_PKG=$(node -p "require('./server.json').packages[0].version")
          echo "package.json=$PKG server.json=$SRV server.json.packages[0]=$SRV_PKG"
          if [ "$PKG" != "$SRV" ] || [ "$PKG" != "$SRV_PKG" ]; then
            echo "::error::Version mismatch: package.json and server.json must carry the same version."
            exit 1
          fi
          echo "version=$PKG" >> "$GITHUB_OUTPUT"
          if npm view "$NAME@$PKG" version >/dev/null 2>&1; then
            echo "$NAME@$PKG is already on npm: nothing to release."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # create the tag and the GitHub release
      id-token: write # npm trusted publishing and MCP Registry login
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Use npm 11 (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Live test against Base mainnet
        run: npm test

      - name: Publish to npm
        run: npm publish --access public

      - name: Wait until npm serves the new version
        run: |
          NAME=$(node -p "require('./package.json').name")
          for i in $(seq 1 40); do
            if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
              echo "available on npm"
              exit 0
            fi
            sleep 15
          done
          echo "::error::npm did not serve the new version within 10 minutes."
          exit 1

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Publish to the MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping."
          else
            gh release create "v$VERSION" --target "$GITHUB_SHA" --generate-notes --title "v$VERSION"
          fi
