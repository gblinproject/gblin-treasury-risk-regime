name = "gblin-mcp"
main = "src/index.js"
compatibility_date = "2026-07-01"
# The npm package's tool handlers (../src) read process.env and use node:crypto.
compatibility_flags = ["nodejs_compat"]

# Kill switch: set MCP_DISABLED = "true" (dashboard → Settings → Variables)
# to make every request return 503 without touching code.
[vars]
MCP_DISABLED = "false"
# Optional: override the Base RPC endpoint.
# GBLIN_RPC_URL = "https://mainnet.base.org"

# Coherence Proof v0 — memoria delle osservazioni (promesse vs condotta)
[[kv_namespaces]]
binding = "COHERENCE"
id = "7234cbebc57b4312885f1d4365b45173"

# Free-surface counter. It lives in D1 rather than KV on purpose: the D1 free allowance is
# 100,000 row writes per day against 1,000 for KV, and it is a SEPARATE quota, so the counter
# cannot put the daily promise seals at risk. D1's UPSERT is also atomic, which removes the
# lost updates a concurrent key-value write can produce.
[[d1_databases]]
binding = "USAGE"
database_name = "gblin-usage"
database_id = "befd24a6-1f21-4cc6-ab54-70e954a8d0dc"

# Every 10 minutes: promise observation and daily seals. Every minute: the auction order relay.
[triggers]
crons = ["*/10 * * * *", "* * * * *"]
